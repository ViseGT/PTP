<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="吊裝PTP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<meta name="theme-color" content="#1d3446">
<title>鋼構吊裝 PTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 工地現場的作業板，直接、清楚、可在陽光下看
   IDEA: 吊裝「劇本」— 像吊車指揮的工作卡，一張一張翻、逐步放行
   PICTURE: 鋼構吊運路徑剖面：吊鉤沿著 6 個階段移動，節點顯示 V / X
   COLOUR and TYPE: 鋼構深藍底帶 + 吊車黃重點 + 停工紅/放行綠；Noto Sans TC + Barlow Condensed 數字
   LAYOUT: iPad 左側步驟欄 + 主作業區；iPhone 底部頁籤、單欄 */
:root{color-scheme:light dark;
--bg:light-dark(#efeee9,#0e1317);--card:light-dark(#ffffff,#172028);--card2:light-dark(#f7f6f2,#1d2832);
--ink:light-dark(#121619,#e8ecef);--mute:light-dark(#59626b,#9aa7b2);--line:light-dark(#d9d6cd,#2b3742);
--steel:#1d3446;--steel2:#27465c;--crane:#f2b705;--craneInk:#1a1400;--stop:#d3261d;--go:#16824a;--warn:#d98200;
--stopBg:light-dark(#fdecea,#3a1614);--goBg:light-dark(#e6f4ec,#10301f);--warnBg:light-dark(#fff3dc,#3a2a0c);
--num:"Barlow Condensed","Noto Sans TC",sans-serif;--r:14px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--crane);outline-offset:2px}
.num{font-family:var(--num);font-weight:700;letter-spacing:.01em}
/* top */
#top{background:var(--steel);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
#top .ttl{flex:1;min-width:0}
#top h1{margin:0;font-size:20px;line-height:1.2;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .sub{font-size:13px;color:#b9c9d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff12;color:#fff;font-weight:700;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;line-height:1.3}
.c-go{background:var(--go);color:#fff}.c-stop{background:var(--stop);color:#fff}.c-warn{background:var(--warn);color:#fff}.c-mute{background:#ffffff22;color:#dfe8ef}.c-y{background:var(--crane);color:var(--craneInk)}
.c-line{border:1px solid var(--line);color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* layout */
.body{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 64px)}
body.home .body{grid-template-columns:minmax(0,1fr)}body.home #nav{display:none}
#nav{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
#nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 12px;border:0;border-radius:12px;background:none;text-align:left;margin-bottom:4px}
#nav button.on{background:var(--steel);color:#fff}
#nav button .lb{flex:1;font-weight:700;line-height:1.25}
#nav button .lb small{display:block;font-weight:400;font-size:13px;color:var(--mute)}
#nav button.on .lb small{color:#b9c9d6}
#nav svg{width:24px;height:24px;flex:none}
.bdg{font-family:var(--num);font-weight:700;font-size:15px;min-width:34px;text-align:center;padding:1px 7px;border-radius:8px;background:var(--card2);border:1px solid var(--line)}
.on .bdg{color:var(--ink)}
.bdg.ok{background:var(--go);color:#fff;border-color:var(--go)}.bdg.bad{background:var(--stop);color:#fff;border-color:var(--stop)}
#main{padding:20px clamp(14px,3vw,32px) 40px;max-width:1100px;width:100%}
h2{font-size:26px;line-height:1.15;margin:0 0 4px;font-weight:900;text-wrap:balance}
h3{font-size:18px;margin:0 0 8px;font-weight:900}
.lead{color:var(--mute);margin:0 0 16px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.sec-t{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec-t h3{margin:0}.sec-t .ln{flex:1;height:1px;background:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;white-space:nowrap;text-decoration:none;color:inherit}
.btn.pri{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.y{background:var(--crane);border-color:var(--crane);color:var(--craneInk)}
.btn.red{background:var(--stop);border-color:var(--stop);color:#fff}
.btn.grn{background:var(--go);border-color:var(--go);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);font-size:16px}
textarea{min-height:76px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:14px;font-weight:700;margin:12px 0 6px}
.hint{font-size:13px;color:var(--mute);line-height:1.45}
/* segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card2);flex-wrap:wrap}
.seg button{min-height:44px;padding:0 14px;border:0;background:none;font-weight:700;font-size:15px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.ok{background:var(--go);color:#fff}.seg button.on.bad{background:var(--stop);color:#fff}.seg button.on.na{background:#6b7680;color:#fff}.seg button.on.pd{background:var(--crane);color:var(--craneInk)}.seg button.on{background:var(--steel);color:#fff}
.tg{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:15px}
.tg.on{background:var(--steel);border-color:var(--steel);color:#fff}
/* info items */
.it{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:12px 16px;padding:14px 0;border-top:1px solid var(--line);align-items:start}
.it:first-of-type{border-top:0}
.it .nm{font-weight:700}.it .nm .hint{font-weight:400;margin-top:2px}
.it.bad{background:var(--stopBg);margin:0 -16px;padding:14px 16px}
@media(max-width:900px){.it{grid-template-columns:minmax(0,1fr)}.it .seg{justify-self:start}}
.wind{display:flex;gap:10px;align-items:center}
.wind input{max-width:140px;font-family:var(--num);font-size:24px;font-weight:700}
.banner{border-radius:12px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
.banner.stop{background:var(--stopBg);color:var(--stop);border:1px solid var(--stop)}
.banner.go{background:var(--goBg);color:var(--go);border:1px solid var(--go)}
.banner.warn{background:var(--warnBg);color:var(--warn);border:1px solid var(--warn)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--num);font-size:34px;line-height:1.05}
.stat span{font-size:13px;color:var(--mute)}
/* crew */
.mem{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:14px;margin-bottom:12px;border-left:6px solid var(--line)}
.mem.ok{border-left-color:var(--go)}.mem.bad{border-left-color:var(--stop);background:var(--stopBg)}.mem.warn{border-left-color:var(--warn)}.mem.rep{opacity:.55}
.mem .hd{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px;align-items:center}
@media(max-width:600px){.mem .hd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mem .hd>:last-child{grid-column:1/-1}}
.hc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.hcb{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);text-align:left;font-size:15px;line-height:1.3}
.hcb i{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:14px}
.hcb.ok i{background:var(--go);border-color:var(--go);color:#fff}.hcb.ng{border-color:var(--stop)}.hcb.ng i{background:var(--stop);border-color:var(--stop);color:#fff}
.fat{display:flex;gap:6px;flex-wrap:wrap}
.fat button{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-family:var(--num);font-weight:700;font-size:18px}
.fat button.on{background:var(--steel);color:#fff;border-color:var(--steel)}.fat button.on.w{background:var(--warn);border-color:var(--warn)}.fat button.on.b{background:var(--stop);border-color:var(--stop)}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sig{height:54px;max-width:180px;background:#fff;border-radius:8px;border:1px solid var(--line)}
/* rehearsal */
.rail{position:relative;margin:4px 0 14px}
.rail svg{display:block;width:100%;aspect-ratio:600/120;height:auto}
.rail .lbl{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.rail .lbl button{border:0;background:none;padding:4px 2px;font-size:13px;line-height:1.25;font-weight:700;color:var(--mute);min-height:44px}
.rail .lbl button.on{color:var(--ink)}
.rail .lbl b{display:block;font-family:var(--num);font-size:16px}
.stg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stg .hd{background:var(--steel);color:#fff;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.stg .hd .n{font-family:var(--num);font-size:44px;line-height:.9;color:var(--crane)}
.stg .hd h2{color:#fff;margin:0;font-size:26px}
.stg .hd .who{color:#b9c9d6;font-size:14px}
.stg .bd{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:18px}
@media(max-width:760px){.stg .bd{grid-template-columns:minmax(0,1fr)}}
.hzl{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hzl li{display:flex;gap:10px;align-items:flex-start;background:var(--stopBg);border-radius:10px;padding:10px 12px;font-weight:700;line-height:1.35}
.hzl li:before{content:"";flex:none;width:0;height:0;margin-top:4px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid var(--stop)}
.ctl{display:grid;gap:8px}
.ctl button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:12px;min-height:52px;line-height:1.45;font-size:16px}
.ctl button i{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:900;font-family:var(--num);font-size:17px}
.ctl button.on{border-color:var(--go);background:var(--goBg)}.ctl button.on i{background:var(--go);border-color:var(--go);color:#fff}
details.qa{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;background:var(--card2)}
details.qa summary{font-weight:700;cursor:pointer;min-height:32px;list-style-position:outside}
details.qa p{margin:8px 0 2px;color:var(--go);font-weight:700}
.stg .ft{border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.big{min-height:56px;font-size:18px;padding:0 22px;border-radius:14px}
body.focus #top,body.focus #nav{display:none}body.focus .body{grid-template-columns:minmax(0,1fr)}body.focus #main{max-width:none;padding-top:calc(env(safe-area-inset-top) + 14px)}
body.focus .stg .hd h2{font-size:34px}body.focus .ctl button{font-size:19px}body.focus .hzl li{font-size:18px}
/* hazards */
.site{position:relative;border-radius:var(--r);overflow:hidden;background:var(--card2);border:1px solid var(--line)}
.site img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.site.mark{outline:4px solid var(--crane);cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-100%);width:34px;height:42px;border:0;background:none;padding:0}
.pin span{display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--stop);border:2px solid #fff;box-shadow:0 2px 6px #0006}
.pin span b{transform:rotate(45deg);color:#fff;font-family:var(--num);font-size:17px}
.pin.m span{background:var(--warn)}.pin.l span{background:#5b6a77}.pin.done span{background:var(--go)}
.hzc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.hzc .no{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--num);font-weight:700;font-size:18px;background:var(--stop)}
.hzc .no.m{background:var(--warn)}.hzc .no.l{background:#5b6a77}.hzc .no.done{background:var(--go)}
.hzc h4{margin:0;font-size:17px}
.thumbs{display:flex;gap:6px;margin-top:6px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
@media(max-width:600px){.hzc{grid-template-columns:auto minmax(0,1fr)}.hzc>:last-child{grid-column:1/-1}}
/* gates */
.gate{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.gate:first-child{border-top:0}
.gate i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff;background:var(--stop)}
.gate.ok i{background:var(--go)}
.gate .t{flex:1;font-weight:700}.gate .t small{display:block;font-weight:400;color:var(--mute);font-size:14px}
.hero{border-radius:var(--r);padding:20px;color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hero b{font-size:clamp(26px,4vw,38px);line-height:1.1;font-weight:900}
.hero.go{background:var(--go)}.hero.stop{background:var(--stop)}.hero.wait{background:var(--steel)}
.log{border-left:4px solid var(--warn);padding:8px 12px;margin:10px 0;background:var(--card2);border-radius:0 10px 10px 0}
/* home */
.homehead{background:var(--steel);color:#fff;padding:22px clamp(16px,4vw,40px) 26px;margin:-20px calc(-1*clamp(14px,3vw,32px)) 20px}
.homehead h2{color:#fff;font-size:clamp(28px,4vw,40px)}
.homehead p{color:#c6d4df;margin:4px 0 16px;max-width:62ch}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pc{display:block;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;color:inherit}
.pc h4{margin:6px 0 2px;font-size:17px;line-height:1.3}
.bar{height:8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--crane)}
.empty{text-align:center;padding:36px 16px;color:var(--mute);border:2px dashed var(--line);border-radius:var(--r)}
.prow{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:12px 4px;color:inherit}
.prow:hover{background:var(--card2)}
.prow .c{font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
/* sheet */
.sheet{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.sheet[hidden]{display:none}
.sheet .box{background:var(--card);border-radius:18px;width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet .box h3{font-size:21px}
canvas.pad{width:100%;height:180px;background:#fff;border-radius:12px;border:2px dashed var(--line);touch-action:none;display:block}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111c;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.focusx{position:fixed;right:max(14px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 12px);z-index:30;display:none}
body.focus .focusx{display:inline-flex}body.focus [data-a=focus]{visibility:hidden}
@media(max-width:760px){
 .body{grid-template-columns:minmax(0,1fr)}
 #nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:25;border-right:0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 #nav button{flex-direction:column;gap:2px;min-height:54px;padding:4px 2px;margin:0;text-align:center;position:relative}
 #nav button .lb{font-size:12px}#nav button .lb small{display:none}
 #nav .bdg{position:absolute;top:2px;right:4px;font-size:12px;min-width:0;padding:0 5px}
 #main{padding-bottom:110px}
 body.focus #main{padding-bottom:40px}
 .sheet{align-items:flex-end;padding:0}.sheet .box{border-radius:18px 18px 0 0;max-height:92vh}
 h2{font-size:23px}.stg .hd h2{font-size:22px}
 #top .tb .tx{display:none}
}
@media (prefers-reduced-motion:no-preference){.hook{transition:transform .45s cubic-bezier(.3,1.3,.5,1)}}
</style>
</head>
<body class="home">
<header id="top"></header>
<div class="body"><nav id="nav" aria-label="PTP 步驟"></nav><main id="main"></main></div>
<button class="btn y focusx" data-a="unfocus">結束專注模式</button>
<div id="sheet" class="sheet" hidden><div class="box" id="box"></div></div>
<div id="toast" role="status"></div>
<script>
{
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const fmt=t=>{if(!t)return'';const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const ymd=()=>{const d=new Date();return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`};

const IDB={db:null,open(){return new Promise(r=>{try{const q=indexedDB.open('steel-ptp',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{this.db=q.result;r(true)};q.onerror=()=>r(false)}catch(e){r(false)}})},

const windV=p=>{const v=parseFloat(p.info.wind.v);return isNaN(v)?null:v};
function infoStats(p){let req=0,ok=0,bad=0;INFO.forEach(s=>s.items.forEach(it=>{req++;const x=p.info[it.k]||{};if(x.st==='ok'||x.st==='na')ok++;if(x.st==='bad')bad++}));return{req,ok,bad}}
function pst(m){if(m.st==='rep')return'rep';const hv=HEALTH.map(h=>m.h[h.k]);
 if(hv.includes('ng'))return'bad';const bp=String(m.bp||'').split('/').map(Number);if(bp[0]>=160||bp[1]>=100)return'bad';
 if(parseFloat(m.alc)>0)return'bad';if(m.fat>=5)return'bad';if(hv.every(v=>v==='ok')&&m.fat)return m.fat>=4?'warn':'ok';return''}
const active=p=>p.crew.filter(m=>m.name.trim()&&m.st!=='rep');
function crewStats(p){const a=active(p);const r={n:a.length,ok:0,bad:0,warn:0,pd:0,sig:0};a.forEach(m=>{const s=pst(m);if(s==='ok')r.ok++;else if(s==='warn'){r.warn++;r.ok++}else if(s==='bad')r.bad++;else r.pd++;if(m.sig)r.sig++});return r}
function gates(p){const i=infoStats(p),w=windV(p),c=crewStats(p),a=active(p);
 const key=['領班','吊車操作手','吊掛指揮手'].filter(r=>!a.some(m=>m.role===r));
 const vs=p.stages.filter(s=>s.st==='V').length;const hh=p.hz.filter(h=>h.sev==='h'&&h.status!=='done').length;
 return[
 {ok:i.ok===i.req,t:'必檢項全部確認',d:`${i.ok}/${i.req} 項完成${i.bad?`，${i.bad} 項異常需改善`:''}`,tab:'info'},
 {ok:w!==null&&w<10,t:'風速低於停工紅線',d:w===null?'尚未輸入現場實測風速':`${w} m/s ${w>=10?'— 達 ≥10 m/s 強制停工':''}`,tab:'info'},
 {ok:(p.info.stopwork||{}).st==='ok',t:'停工權已宣達',d:'任一成員發現異常皆可直接喊停',tab:'info'},
 {ok:!key.length,t:'關鍵角色到位',d:key.length?'缺：'+key.join('、'):'領班、操作手、指揮手皆已登錄',tab:'crew'},
 {ok:c.n>0&&c.bad===0&&c.pd===0,t:'全員身心狀態正常',d:c.n?`${c.ok}/${c.n} 正常${c.bad?`，${c.bad} 人異常須替換`:''}${c.pd?`，${c.pd} 人未檢核`:''}`:'尚未登錄人員',tab:'crew'},
 {ok:c.n>0&&c.sig===c.n,t:'全員親自簽署',d:`${c.sig}/${c.n} 已簽`,tab:'crew'},
 {ok:vs===6,t:'六階段劇本皆已落實 (V)',d:`${vs}/6 階段${p.stages.some(s=>s.st==='X')?'，有階段未達標':''}`,tab:'run'},
 {ok:hh===0,t:'高風險危害已全數排除',d:hh?`${hh} 項高風險未排除`:`共標記 ${p.hz.length} 項，${p.hz.filter(h=>h.status!=='done').length} 項中低風險追蹤中`,tab:'hz'}]}
function status(p){const g=gates(p),ok=g.every(x=>x.ok),n=g.filter(x=>x.ok).length;
 if(p.rel.state==='go')return ok?{k:'go',l:'已放行',c:'c-go'}:{k:'chg',l:'放行後條件變動',c:'c-warn'};
 if(p.rel.state==='pause')return{k:'pause',l:'暫停・重新評估',c:'c-stop'};
 if(windV(p)>=10)return{k:'wind',l:'風速停工',c:'c-stop'};
 return ok?{k:'ready',l:'可放行',c:'c-y'}:{k:'prep',l:`準備中 ${n}/${g.length}`,c:'c-mute',pct:n/g.length}}

function parseCSV(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
 if(f||row.length){row.push(f);rows.push(row)}return rows}
function toPermit(o){const c=(o['施工內容']||'').replace(/\r\n?/g,'\n'),kv={};
 c.split('\n').forEach(l=>{const m=l.match(/^\s*([^:：]{1,14})[:：]\s*(.*)$/);if(m)kv[m[1].trim()]=m[2].trim()});
 const pick=(...ks)=>{for(const k of ks)if(kv[k])return kv[k];return''};
 const names=s=>s?s.split(/[、,，\/\s]+/).filter(x=>x&&x.length<=4&&/[一-鿿]/.test(x)):[];
 const carSrc=pick('車號','車牌','車牌號碼','吊車車號','吊車車牌','吊車編號','吊車','v車號')||c;
 const car=(carSrc.match(/[A-Z]{1,3}-\d{2,4}/i)||[''])[0];
 const wt=(pick('預計吊掛物最大重量')||'').match(/(\d+(?:\.\d+)?)\s*(T|t|噸)/);
 return{fac:o['廠別']||'',no:o['單號']||'',main:o['主承商']||'',sub:o['次承商']||'',area:o['施工區域']||'',content:c,start:o['施工開始日期']||'',end:o['施工結束日期']||'',risk:o['風險判定']||'',detail:o['作業細項']||'',state:o['施工狀態']||'',safety:o['工安']||'',safetyTel:o['工安電話']||'',sup:o['監工']||'',supTel:o['監工電話']||'',car,items:pick('吊掛物','吊掛物料','吊掛內容物','吊移吊運物料','吊掛種類'),wt:wt?wt[1]+' t':'',ops:names(pick('吊車操作手','司機')),sig:names(pick('指揮吊掛手')),company:pick('吊車公司','吊車廠商','廠商'),steel:/鋼構|鋼柱|鋼樑|鋼梁|鋼梯|鋼骨/.test(c)}}
function importCSV(text){const rows=parseCSV(text);if(rows.length<2){toast('檔案內容讀不到資料');return}
 const hd=rows[0].map(h=>h.trim());if(!hd.includes('作業類別')||!hd.includes('施工內容')){toast('欄位格式不符（需含「作業類別」「施工內容」）');return}
 const list=rows.slice(1).filter(r=>r.length>=hd.length-2).map(r=>Object.fromEntries(hd.map((h,i)=>[h,r[i]||'']))).filter(o=>/吊掛/.test(o['作業類別'])&&o['施工狀態']!=='施工取消').map(toPermit);
 S.permits=list;if(!LS.set('ptp.permits',list))toast('許可單只保留在本次開啟期間');
 toast(`已匯入 ${list.length} 筆吊掛作業許可單`);permitSheet()}

  if(pm.start)p.info.date.v=pm.start.replace(/-/g,'/')+' 08:00–17:00'}
 p.crew=['領班','吊車操作手','吊掛指揮手','吊掛手','吊掛手','高空接料工','高空接料工','地面交管人員'].map(r=>mem(r));
 if(pm){if(pm.ops[0])p.crew[1].name=pm.ops[0];if(pm.sig[0])p.crew[2].name=pm.sig[0]}

   const seg=it.type==='wind'?`<span class="chip ${w===null?'c-line':w>=10?'c-stop':'c-go'}">${w===null?'待輸入':w>=10?'強制停工':'風速正常'}</span>`:

  <div class="ctl" style="margin-top:8px">${st.c.map((c,k)=>`<button class="${x.chk[k]?'on':''}" data-a="chk" data-v="${k}"><i>${x.chk[k]?'✓':k+1}</i><span>${c}</span></button>`).join('')}</div>

function setupPad(){const c=$('#pad'),r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';c._n=0;let d=false,l=null;
 const pt=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 c.onpointerdown=e=>{d=true;l=pt(e);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!d)return;const q=pt(e);x.beginPath();x.moveTo(l[0],l[1]);x.lineTo(q[0],q[1]);x.stroke();l=q;c._n++};
 c.onpointerup=c.onpointercancel=()=>{d=false}}
function padData(){const c=$('#pad');if(!c||c._n<6)return null;const o=document.createElement('canvas');o.width=300;o.height=Math.round(300*c.height/c.width);o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/png')}

async function photo(file,max){const url=URL.createObjectURL(file);try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
 const big=!!ASSETS,m=big?(max||1600):(IDB.db?1280:640),k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 if(ASSETS){const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.72));try{const a=await ASSETS.upload(blob);return a.url||('/_blob/'+a.id)}catch(e){toast('照片上傳失敗，改存為縮圖')}}
 if(IDB.db)return c.toDataURL('image/jpeg',.62);
 const k2=Math.min(1,640/Math.max(c.width,c.height)),s2=document.createElement('canvas');s2.width=Math.round(c.width*k2);s2.height=Math.round(c.height*k2);s2.getContext('2d').drawImage(c,0,0,s2.width,s2.height);return s2.toDataURL('image/jpeg',.55)}finally{URL.revokeObjectURL(url)}}

 <h1>鋼構吊掛作業前危害辨識計畫 (PTP)</h1><p>${esc(pTitle(p))}｜狀態：<b>${esc(s.l)}</b>${p.rel.at?`｜放行：${esc(p.rel.by)} ${fmt(p.rel.at)}`:''}｜產出：${fmt(Date.now())}</p>
 ${p.permit?`<p>許可單 ${esc(p.permit.no)}・${esc(p.permit.fac)}・工安 ${esc(p.permit.safety)} ${esc(p.permit.safetyTel)}・監工 ${esc(p.permit.sup)} ${esc(p.permit.supTel)}</p>`:''}
 <h2>01 基本資訊與介面管制</h2><table><tr><th>項目</th><th>內容</th><th>狀態</th></tr>${INFO.flatMap(s=>s.items).map(it=>{const x=p.info[it.k];const st=it.type==='wind'?(windV(p)===null?'待輸入':windV(p)>=10?'強制停工':'正常'):(ST.find(a=>a[0]===(x.st||'pd'))[1]);return`<tr>${td(it.l)}${td(x.v)}<td class="${x.st==='bad'||st==='強制停工'?'ng':x.st==='ok'||st==='正常'?'ok':''}">${esc(st)}</td></tr>`}).join('')}</table>
 <h2>02 分階段危害辨識與控制對策（排練結果）</h2><table><tr><th>階段</th><th>潛在危害</th><th>控制對策確認</th><th>負責人</th><th>結果</th><th>補充</th></tr>${STAGES.map((st,i)=>{const x=p.stages[i];return`<tr><td>${i+1}. ${st.t}</td><td>${st.h.join('<br>')}</td><td>${st.c.map((c,k)=>`${x.chk[k]?'✓':'□'} ${c}`).join('<br>')}</td>${td(x.who.join('、')||st.r)}<td class="${x.st==='V'?'ok':x.st==='X'?'ng':''}">${x.st||'待確認'}</td>${td(x.note)}</tr>`}).join('')}</table>
 <h2>現場危害標記與排除</h2>${site?`<img src="${site}" style="max-width:100%;max-height:360px">`:''}<table><tr><th>#</th><th>危害</th><th>等級</th><th>階段/位置</th><th>對策</th><th>負責</th><th>狀態</th><th>照片</th></tr>${p.hz.map((h,k)=>`<tr><td>${k+1}</td>${td(h.title)}${td(SEV[h.sev])}${td((h.stage===''||h.stage==null?'整體':STAGES[+h.stage].s)+' / '+(h.where||''))}${td((h.lv?h.lv+'：':'')+(h.measure||''))}${td(h.owner)}<td class="${h.status==='done'?'ok':'ng'}">${h.status==='done'?'已排除 '+fmt(h.closedAt):'未排除'}</td><td>${ph[h.id].filter(Boolean).map(u=>`<img class="p" src="${u}">`).join('')}</td></tr>`).join('')||'<tr><td colspan="8">無</td></tr>'}</table>
 <h2>03-A 班組身心狀態與簽署</h2><table><tr><th>#</th><th>角色</th><th>姓名</th><th>身心狀態</th><th>精神/血壓/酒測</th><th>簽名</th><th>備註</th></tr>${p.crew.filter(m=>m.name.trim()).map((m,k)=>{const st=pst(m);return`<tr><td>${k+1}</td>${td(m.role)}${td(m.name)}<td class="${st==='ok'||st==='warn'?'ok':st==='bad'?'ng':''}">${{ok:'正常',warn:'正常(疲勞注意)',bad:'異常(禁止作業)',rep:'已替換',''
 :'未檢核'}[st]}</td>${td([m.fat?FAT[m.fat]:'',m.bp,m.alc&&m.alc+' mg/L'].filter(Boolean).join(' / '))}<td>${m.sig?`<img class="s" src="${m.sig}"><br>${fmt(m.sigAt)}`:''}</td>${td([m.isNew?'新進人員':'',m.rep?'替換為 '+m.rep:''].filter(Boolean).join('；'))}</tr>`}).join('')}</table>
 <h2>放行條件</h2><table>${g.map(x=>`<tr><td class="${x.ok?'ok':'ng'}">${x.ok?'✓':'✕'}</td>${td(x.t)}${td(x.d)}</tr>`).join('')}</table>${p.rel.sig?`<p>領班放行簽名：<img class="s" src="${p.rel.sig}"> ${esc(p.rel.by)} ${fmt(p.rel.at)}</p>`:''}
 <h2>03-B 動態修訂紀錄</h2><table><tr><th>次數</th><th>時間</th><th>觸發原因</th><th>新增/調整對策</th><th>領班確認</th><th>業主/安衛複查</th></tr>${p.revs.map((r,k)=>`<tr><td>${k+1}</td>${td(fmt(r.at))}${td(r.why.join('、'))}${td(r.measure)}<td>${esc(r.by)}${r.sig?`<br><img class="s" src="${r.sig}">`:''}</td>${td(r.rv)}</tr>`).join('')||'<tr><td colspan="6">無</td></tr>'}</table>
 <p style="color:#666">※ 吊車一機三證、鋼索斷股數、卸克規格、吊索夾角等物理防呆項目，請併同 CraneCheck 高風險吊掛檢點表執行放行。</p></body></html>`}
function hzCSV(p){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 return'﻿'+[['編號','危害','風險等級','階段','位置','對策層級','排除對策','負責人','狀態','建立時間','排除時間'],...p.hz.map((h,k)=>[k+1,h.title,SEV[h.sev],h.stage===''||h.stage==null?'整體環境':STAGES[+h.stage].s,h.where,h.lv,h.measure,h.owner,h.status==='done'?'已排除':'未排除',fmt(h.at),fmt(h.closedAt)])].map(r=>r.map(q).join(',')).join('\r\n')}
const fname=p=>`PTP_${(p.permit&&p.permit.no)||''}_${pTitle(p).replace(/[\\/:*?"<>|\s;.]+/g,'_').slice(0,30)}`;

/* ---------- 事件 ---------- */
const A={
 home(){S.cur=null;S.mark=false;document.body.classList.remove('focus');render();window.scrollTo(0,0)},
 open(e){S.cur=e.dataset.v;S.tab='info';S.stage=0;render();window.scrollTo(0,0)},
 blank(){newPTP(null)},
 permits(){permitSheet()},
 close(){closeSheet();render()},
 pick(e){const pm=S.permits.find(x=>x.no===e.dataset.v);if(pm)newPTP(pm)},
 pfsteel(){S.pf.steel=!S.pf.steel;permitSheet()},
 tab(e){S.tab=e.dataset.v;S.mark=false;render();window.scrollTo(0,0)},
 st(e){const x=P().info[e.dataset.k];x.st=e.dataset.v==='pd'?'':e.dataset.v;touch();render()},
 chg(e){const x=P().info.change,v=e.dataset.v;let s=x.v?x.v.split('、'):[];
  if(v==='無變更')s=s.includes(v)?[]:[v];else{s=s.filter(a=>a!=='無變更');s=s.includes(v)?s.filter(a=>a!==v):[...s,v]}
  x.v=s.join('、');if(s.length&&!x.st)x.st='ok';if(s.length&&s[0]!=='無變更')toast('有變更點：排練時請特別說明並標記相關危害');touch();render()},
 hc(e){const m=P().crew[+e.dataset.i],k=e.dataset.k,v=m.h[k];m.h[k]=v==='ok'?'ng':v==='ng'?'':'ok';if(m.sig&&pst(m)==='bad'){m.sig='';m.sigAt=0;toast('狀態異常，原簽名已作廢')}touch();render()},
 fat(e){const m=P().crew[+e.dataset.i];m.fat=+e.dataset.v;if(m.fat>=5){m.sig='';m.sigAt=0}if(m.fat===4)toast('疲勞偏高：建議調整為地面工作或加強監看');touch();render()},
 isnew(e){const m=P().crew[+e.dataset.i];m.isNew=!m.isNew;if(m.isNew){const c=P().info.change;const s=(c.v?c.v.split('、'):[]).filter(a=>a!=='無變更');if(!s.includes('新進人員'))s.push('新進人員');c.v=s.join('、')}touch();render()},
 addm(){P().crew.push(mem('吊掛手'));touch();render()},
 rmm(e){const p=P(),m=p.crew[+e.dataset.i];if(m.sig&&!S.cf){S.cf=1;toast('此人已簽名，再按一次移除');setTimeout(()=>S.cf=0,2500);return}p.crew.splice(+e.dataset.i,1);touch();render()},
 rep(e){const ix=+e.dataset.i;openSheet(`<h3>替換異常人員</h3><p class="hint">原人員保留紀錄並標示已替換，替補人員須重新完成身心檢核與簽名。</p><label class="f">替補人員姓名</label><input type="text" id="repn" placeholder="姓名"><div class="row" style="margin-top:14px"><button class="btn" data-a="close">取消</button><span class="sp"></span><button class="btn pri big" data-a="repok" data-i="${ix}">確認替換</button></div>`)},
 repok(e){const n=$('#repn').value.trim();if(!n){toast('請輸入替補人員姓名');return}const p=P(),ix=+e.dataset.i,m=p.crew[ix];m.st='rep';m.rep=n;const nm=mem(m.role);nm.name=n;p.crew.splice(ix+1,0,nm);closeSheet();touch();render()},
 sign(e){const ix=+e.dataset.i,m=P().crew[ix];sigSheet(`${esc(m.role)}・${esc(m.name||'未填姓名')}`,'本人已充分理解今日作業步驟、危害對策、停工權與緊急撤離動線，並確認身心狀態良好。',d=>{m.sig=d;m.sigAt=Date.now()})},
 padclr(){const c=$('#pad');c.getContext('2d').clearRect(0,0,c.width,c.height);c._n=0},
 padok(){const d=padData();if(!d){toast('請在框內簽名');return}const cb=S.sigcb;if(cb&&cb(d)===false)return;closeSheet();touch(null,true);render()},
 stage(e){S.stage=+e.dataset.v;render();const r=$('.rail');if(r&&r.getBoundingClientRect().top<0)r.scrollIntoView({block:'start'})},
 chk(e){const x=P().stages[S.stage],k=+e.dataset.v;x.chk[k]=!x.chk[k];if(!x.chk[k]&&x.st==='V')x.st='';touch();render()},
 who(e){const x=P().stages[S.stage],v=e.dataset.v;x.who=x.who.includes(v)?x.who.filter(a=>a!==v):[...x.who,v];touch();render()},
 sx(e){const x=P().stages[S.stage],st=STAGES[S.stage],v=e.dataset.v;
  if(v==='V'&&st.c.some((_,k)=>!x.chk[k])){toast('還有控制對策未確認，請逐條唸出並確認');return}
  if(v==='V'&&P().hz.some(h=>+h.stage===S.stage&&h.stage!==''&&h.sev==='h'&&h.status!=='done')){toast('本階段有高風險危害未排除');return}
  x.st=x.st===v?'':v;touch();render();if(x.st==='X'){toast('已暫停：記錄原因並標記危害');const t=$(`[data-f="stages.${S.stage}.note"]`);t&&t.focus()}},
 focus(){document.body.classList.add('focus');window.scrollTo(0,0)},
 unfocus(){document.body.classList.remove('focus')},
 hznew(e){const st=e.dataset.v;hzSheet({id:uid(),title:'',sev:'h',stage:st,where:'',lv:'',measure:'',owner:'',ph:'',ph2:'',status:'open',at:Date.now(),closedAt:0,pin:null})},
 hzedit(e){if(S.mark)return;const h=P().hz.find(x=>x.id===e.dataset.v);if(h)hzSheet(JSON.parse(JSON.stringify(h)))},
 hzq(e){const i=$('[data-d=title]');i.value=i.value?i.value+'、'+e.dataset.v:e.dataset.v;S.draft.title=i.value},
 dset(e){const d=S.draft;d[e.dataset.k]=e.dataset.v;keepDraft();hzSheet(d)},
 hzsave(){keepDraft();const p=P(),d=S.draft;if(!d.title.trim()){toast('請填寫危害描述');return}
  if(d.status==='done'&&!d.measure.trim()){toast('結案前請填寫具體排除對策');return}
  if(d.status==='done'&&!d.closedAt)d.closedAt=Date.now();if(d.status!=='done')d.closedAt=0;
  const i=p.hz.findIndex(x=>x.id===d.id);if(i>=0)p.hz[i]=d;else p.hz.push(d);
  if(d.stage!==''&&d.sev==='h'&&d.status!=='done'&&p.stages[+d.stage].st==='V')p.stages[+d.stage].st='';
  closeSheet();touch(null,true);render()},
 hzdel(){const p=P();if(!S.cf){S.cf=1;toast('再按一次確認刪除');setTimeout(()=>S.cf=0,2500);return}S.cf=0;p.hz=p.hz.filter(x=>x.id!==S.draft.id);closeSheet();touch(null,true);render()},
 hzf(e){S.hzf=e.dataset.v;render()},
 mark(){S.mark=!S.mark;render();if(S.mark)toast('點照片上的危害位置')},
 release(){const p=P();if(!gates(p).every(x=>x.ok))return;const by=(active(p).find(m=>m.role==='領班')||{}).name||p.info.foreman.v||'';
  sigSheet('領班放行簽名','確認以上條件全數通過，班組已完成吊裝劇本排練，同意開始吊裝作業。',d=>{const n=$('#relby').value.trim();if(!n){toast('請填寫領班姓名');return false}p.rel={state:'go',at:Date.now(),by:n,sig:d}},`<label class="f">領班姓名</label><input type="text" id="relby" value="${esc(by)}" style="margin-bottom:10px">`)},
 rev(){const p=P();S.rv={why:[]};const by=(active(p).find(m=>m.role==='領班')||{}).name||'';
  sigSheet('暫停並重新評估','條件變更時立即暫停作業，記錄觸發原因與新增對策，由領班簽名確認。',d=>{const ms=$('#rvm').value.trim();if(!S.rv.why.length||!ms){toast('請選擇觸發原因並填寫對策');return false}
   p.revs.push({at:Date.now(),why:S.rv.why,measure:ms,by:$('#rvb').value.trim(),rv:$('#rvr').value.trim(),sig:d});if(p.rel.state==='go')p.rel.state='pause';
   if(S.rv.why.some(w=>/風速/.test(w)))toast('請到基本資訊更新實測風速')},
   `<label class="f">觸發變更原因</label><div class="chips" id="rvw">${TRIG.map(t=>`<button class="tg" data-a="rvw" data-v="${t}">${t}</button>`).join('')}</div>
   <label class="f">新增／調整之具體控制對策</label><textarea id="rvm"></textarea><div class="mini"><div><label class="f">領班</label><input type="text" id="rvb" value="${esc(by)}"></div><div><label class="f">業主／安衛複查（選填）</label><input type="text" id="rvr"></div></div><label class="f">領班簽名</label>`)},
 rvw(e){const v=e.dataset.v,w=S.rv.why;S.rv.why=w.includes(v)?w.filter(a=>a!==v):[...w,v];e.classList.toggle('on')},
 async dlrep(){const p=P();try{toast('報告產生中…');const html=await report(p);await saveFile(fname(p)+'.html',html,'text/html;charset=utf-8');toast('報告已下載')}catch(e){if(e&&e.code!=='declined')toast('無法下載：'+(e&&e.code||'錯誤'))}},
 async dlcsv(){const p=P();try{await saveFile(fname(p)+'_危害清單.csv',hzCSV(p),'text/csv;charset=utf-8')}catch(e){if(e&&e.code!=='declined')toast('無法下載')}},
 copy(){const t=summary(P());try{navigator.clipboard.writeText(t).then(()=>toast('已複製摘要'),()=>showText(t))}catch(e){showText(t)}},
 del(){openSheet(`<h3>刪除此 PTP？</h3><p>「${esc(pTitle(P()))}」的所有紀錄、簽名與危害將一併刪除，無法復原。</p><div class="row"><button class="btn" data-a="close">取消</button><span class="sp"></span><button class="btn red big" data-a="delok">刪除</button></div>`)},
 async demo(){try{const r=await fetch('demo/demo.json',{cache:'no-cache'});if(!r.ok)throw 0;const j=await r.json();let n=0;
  (j.ptps||[]).forEach(d=>{if(d&&d.id){S.ptps[d.id]=d;if(DB)S.dirty[d.id]=1;n++}});persistLocal();if(DB)Object.keys(S.dirty).forEach(id=>push(id));toast(`已載入 ${n} 份示範 PTP`);render()}catch(e){toast('找不到示範資料（demo/demo.json）')}},
 async bkout(){try{await saveFile(`PTP備份_${stamp()}.json`,JSON.stringify({app:'steel-ptp',version:1,exportedAt:Date.now(),ptps:S.ptps}),'application/json');toast('備份已匯出')}catch(e){if(e&&e.code!=='declined')toast('無法匯出備份')}},
 async delok(){const id=S.cur;delete S.ptps[id];S.cur=null;closeSheet();persistLocal();render();if(DB&&!S.ro){try{await DB.collection('ptp').doc(id).delete()}catch(e){toast('雲端刪除失敗')}}}};
function showText(t){openSheet(`<div class="row"><h3 class="sp" style="margin:0">摘要文字</h3><button class="btn sm" data-a="close">關閉</button></div><p class="hint">長按全選後複製。</p><textarea style="min-height:50vh" readonly>${esc(t)}</textarea>`)}
function keepDraft(){const d=S.draft;if(!d)return;document.querySelectorAll('[data-d]').forEach(el=>{d[el.dataset.d]=el.value})}

document.addEventListener('click',e=>{
 const site=e.target.closest('#site');if(site&&S.mark&&!e.target.closest('.pin')){const r=site.getBoundingClientRect();const pin={x:+((e.clientX-r.left)/r.width*100).toFixed(1),y:+((e.clientY-r.top)/r.height*100).toFixed(1)};S.mark=false;
  hzSheet({id:uid(),title:'',sev:'h',stage:'',where:'',lv:'',measure:'',owner:'',ph:'',ph2:'',status:'open',at:Date.now(),closedAt:0,pin});return}
 const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'){closeSheet();render()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.pf){S.pf[t.dataset.pf]=t.value;if(t.tagName==='INPUT'){clearTimeout(S.pft);S.pft=setTimeout(()=>{const pos=t.selectionStart;permitSheet();const n=$('[data-pf=q]');if(n){n.focus();n.setSelectionRange(pos,pos)}},250)}return}
 if(t.dataset.d&&S.draft){S.draft[t.dataset.d]=t.value;return}
 const f=t.dataset.f;if(!f||!P())return;const k=f.split('.');let o=P();for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=t.value;
 if(f==='info.wind.v')P().info.wind.st=t.value===''?'':(+t.value>=10?'bad':'ok');
 if(/^crew\.\d+\.name$/.test(f)){const m=o;if(m.role==='領班'&&!P().info.foreman.v)P().info.foreman.v=t.value}
 touch()});
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset.pf){S.pf[t.dataset.pf]=t.value;permitSheet();return}
 if(t.dataset.f&&(t.dataset.r||t.tagName==='SELECT')){render();return}
 const up=t.dataset.up;if(!up||!t.files||!t.files[0])return;const file=t.files[0];
 if(up==='backup'){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(String(r.result));const src=j.ptps||j;let n=0;
   Object.values(src).forEach(d=>{if(!d||!d.id||!d.info||!d.crew)return;const l=S.ptps[d.id];if(!l||(d.updatedAt||0)>=(l.updatedAt||0)){S.ptps[d.id]=d;if(DB){S.dirty[d.id]=1;push(d.id)}n++}});
   persistLocal();render();toast(`已匯入 ${n} 份 PTP`)}catch(e){toast('備份檔格式不正確')}};r.readAsText(file,'utf-8');t.value='';return}
 if(up==='csv'){const r=new FileReader();r.onload=()=>importCSV(String(r.result));r.onerror=()=>toast('讀取檔案失敗');r.readAsText(file,'utf-8');return}
 toast('照片處理中…');try{const u=await photo(file,up==='site'?2000:1600);
  if(up==='site'){P().site=u;touch(null,true);render()}else if(S.draft){keepDraft();S.draft[up]=u;hzSheet(S.draft)}toast('照片已加入')}catch(err){toast('無法讀取這張照片')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden){closeSheet();render()}
 if(P()&&S.tab==='run'&&$('#sheet').hidden&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){if(e.key==='ArrowRight'&&S.stage<5){S.stage++;render()}if(e.key==='ArrowLeft'&&S.stage>0){S.stage--;render()}}});

render();initStore().then(initCaps);
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
}
</script>
</body>
</html>
